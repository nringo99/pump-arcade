<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUMP DROP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* brand constants (the stage keeps these in both themes) */
  --green:#24FF55; --green-deep:#0FB53A; --ink:#080808; --lav:#F1F0FF; --white:#FFFFFF;
  --red:#FF5A65; --red-soft:#FFE0E4; --muted:#686878;
  /* page tokens (theme-aware) */
  --page:#F1F0FF; --page-ink:#080808; --page-muted:#686878; --page-line:rgba(8,8,8,.12); --page-chip:#FFFFFF;
  --display:"Archivo","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --page:#0C0C13; --page-ink:#F3F2FF; --page-muted:#9B9BAE; --page-line:rgba(255,255,255,.16); --page-chip:#191922; }
}
:root[data-theme="dark"]{ color-scheme:dark; --page:#0C0C13; --page-ink:#F3F2FF; --page-muted:#9B9BAE; --page-line:rgba(255,255,255,.16); --page-chip:#191922; }

*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--page); color:var(--page-ink); font-family:var(--body);
  -webkit-font-smoothing:antialiased; overflow-x:hidden; touch-action:manipulation}
#root{min-height:100%}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--page-ink); outline-offset:3px}
.stage :focus-visible{outline-color:var(--ink)}

.page{display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px clamp(12px,3vw,28px) 14px; min-height:100%}
.top{width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between}
.wordmark{display:inline-flex; align-items:center; gap:.38em; font-family:var(--display); font-weight:900; font-stretch:112%; letter-spacing:-.01em; font-size:26px; line-height:1; color:var(--page-ink); text-decoration:none}
.wordmark svg{width:1.18em; height:1.18em; fill:currentColor; flex:none}
.sound{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 14px 0 12px; border-radius:999px; border:1px solid var(--page-line); background:var(--page-chip); cursor:pointer; font-weight:600; font-size:13px; transition:transform .15s ease, border-color .15s ease}
.sound:hover{transform:translateY(-1px); border-color:var(--page-ink)}
.sound svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.sound[aria-pressed="true"] .dot{background:var(--green)}
.sound .dot{width:8px; height:8px; border-radius:50%; background:var(--page-line)}

/* ---------- stage ---------- */
.stage{position:relative; width:100%; max-width:900px; aspect-ratio:16/10;
  max-height:max(380px, calc(100vh - 150px));
  max-height:max(380px, calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));
  border-radius:28px; border:1.5px solid rgba(8,8,8,.1); overflow:hidden; color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% 110%, rgba(36,255,85,.16), rgba(36,255,85,0) 60%),
    linear-gradient(rgba(8,8,8,.035) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg, rgba(8,8,8,.035) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(180deg,#FFFFFF, #F6F5FF 70%, #EFEEFF);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -28px rgba(40,30,120,.35), 0 8px 20px -12px rgba(40,30,120,.2);
  container-type:size; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  transition:border-color .12s ease, box-shadow .12s ease}
.stage.hit{border-color:var(--red); box-shadow:0 0 0 4px rgba(255,90,101,.35), 0 30px 60px -28px rgba(255,90,101,.5)}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
@media (max-width:640px){
  .page{gap:10px; padding-top:12px}
  .stage{aspect-ratio:auto; max-height:760px; border-radius:22px;
    height:max(430px, calc(100vh - 128px));
    height:max(430px, calc(100dvh - 128px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
  .wordmark{font-size:22px}
}

/* ---------- HUD ---------- */
.hud{position:absolute; inset:0 0 auto 0; z-index:2; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
  padding:clamp(10px,2.6cqh,18px) clamp(12px,2.4cqw,22px); pointer-events:none; animation:fade .3s ease both}
.hud-brand{display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:900; font-stretch:112%; font-size:19px; line-height:1}
.hud-brand svg{width:24px; height:24px; fill:var(--ink)}
.hud-score{display:flex; align-items:baseline; gap:8px; padding:8px 16px; border-radius:999px; background:rgba(255,255,255,.86); border:1.5px solid rgba(8,8,8,.08); box-shadow:0 6px 16px -10px rgba(40,30,120,.4); font-weight:800; white-space:nowrap}
.hud-score .lbl{font-size:12px; letter-spacing:.08em; color:var(--muted)}
.hud-score .val{font-size:clamp(20px,3.2cqw,26px); font-variant-numeric:tabular-nums; letter-spacing:-.02em; display:inline-block; transform-origin:50% 60%}
.hud-score .val.pop{animation:pop .22s ease-out}
.hud-right{display:flex; align-items:center; justify-content:flex-end; gap:clamp(6px,1.4cqw,12px)}
.timer{font-weight:800; font-size:clamp(17px,2.6cqw,22px); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.timer.low{color:#E0263A; animation:pulse 1s ease-in-out infinite}
.hearts{display:flex; gap:3px}
.heart{width:clamp(17px,2.4cqw,22px); height:clamp(17px,2.4cqw,22px); fill:var(--ink); stroke:var(--ink); stroke-width:2; stroke-linejoin:round; transition:fill .25s ease, opacity .25s ease}
.heart.lost{fill:transparent; opacity:.45; animation:heartLost .45s ease-out}
.iconbtn{pointer-events:auto; width:34px; height:34px; border-radius:50%; border:1.5px solid rgba(8,8,8,.12); background:rgba(255,255,255,.9); display:grid; place-items:center; cursor:pointer; padding:0; transition:transform .15s ease, border-color .15s ease}
.iconbtn:hover{transform:scale(1.06); border-color:var(--ink)}
.iconbtn svg{width:14px; height:14px; fill:var(--ink)}
@container (max-width:520px){
  .hud-brand span{display:none}
  .hud-score{padding:6px 12px; gap:6px}
  .hud-score .lbl{font-size:10px}
  .iconbtn{width:30px; height:30px}
}

/* ---------- overlays ---------- */
.overlay{position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:clamp(6px,2.3cqh,16px); padding:clamp(12px,4cqh,32px) clamp(16px,5cqw,48px); overflow:auto; animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.overlay.veil{background:rgba(244,243,255,.82)}
.hero{position:relative; width:clamp(46px,15cqh,88px); height:clamp(46px,15cqh,88px); flex:none}
.hero .glow{position:absolute; inset:-55%; border-radius:50%; background:radial-gradient(closest-side, rgba(36,255,85,.75), rgba(36,255,85,.28) 55%, rgba(36,255,85,0)); animation:breathe 3.6s ease-in-out infinite}
.hero svg{position:relative; width:100%; height:100%; fill:var(--ink); animation:bob 3.2s ease-in-out infinite; transform-origin:50% 60%}
.title{margin:0; font-family:var(--display); font-weight:900; font-stretch:118%; line-height:.92; letter-spacing:-.025em; font-size:clamp(34px,min(11.5cqw,16cqh),92px)}
.tag{margin:0; font-size:clamp(14px,min(2.6cqw,3.6cqh),20px); font-weight:500; color:var(--muted)}
.btn{position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:clamp(46px,10cqh,58px); padding:0 clamp(22px,4cqw,34px); border-radius:999px; border:2px solid var(--ink);
  font-family:var(--display); font-weight:900; font-stretch:110%; font-size:clamp(15px,min(2.4cqw,3.6cqh),19px); letter-spacing:.01em; cursor:pointer; color:var(--ink); text-decoration:none; white-space:nowrap;
  box-shadow:0 5px 0 var(--ink); transition:transform .14s ease, box-shadow .14s ease, background .14s ease; flex:none}
.btn.primary{background:var(--green)}
.btn.ghost{background:var(--white)}
.btn:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.btn .arr{display:inline-block; transition:transform .18s ease}
.btn:hover .arr{transform:translateX(4px)}
.btn:hover .spin{transform:rotate(90deg)}
.how{list-style:none; margin:clamp(2px,1cqh,8px) 0 0; padding:0; display:flex; flex-wrap:wrap; justify-content:center; gap:8px clamp(14px,3cqw,28px); font-weight:600; font-size:clamp(12.5px,min(1.9cqw,3cqh),15px)}
.how li{display:flex; align-items:center; gap:8px}
.kbd{display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 6px; border-radius:7px; background:var(--white); border:1.5px solid rgba(8,8,8,.16); box-shadow:0 2px 0 rgba(8,8,8,.16); font-size:13px; font-weight:700}
.kbd + .kbd{margin-left:-4px}
.tok{width:24px; height:24px; border-radius:50%; display:inline-grid; place-items:center; font-weight:900; font-size:14px; line-height:1; color:var(--ink); flex:none}
.tok.save{background:var(--green); box-shadow:0 3px 6px rgba(15,181,58,.35), inset 0 -2px 0 rgba(0,0,0,.12)}
.tok.waste{background:#FF7D87; box-shadow:0 3px 8px rgba(255,90,101,.5), inset 0 -2px 0 rgba(0,0,0,.12); font-size:12px}
.note{margin:0; font-size:clamp(12px,min(1.7cqw,2.8cqh),14px); color:var(--muted)}
.best{margin:0; display:inline-flex; gap:8px; align-items:baseline; padding:6px 14px; border-radius:999px; background:var(--ink); color:var(--white); font-weight:800; font-size:clamp(11px,min(1.6cqw,2.6cqh),13px); letter-spacing:.08em}
.best b{color:var(--green); font-size:1.15em; letter-spacing:0; font-variant-numeric:tabular-nums}

/* results */
.res-title{margin:0; font-family:var(--display); font-weight:900; font-stretch:115%; letter-spacing:-.02em; line-height:1; font-size:clamp(20px,min(5cqw,7cqh),40px)}
.kicker{margin:0; font-weight:800; letter-spacing:.14em; font-size:clamp(11px,2.4cqh,13px); color:var(--muted)}
.total{font-family:var(--display); font-weight:900; font-stretch:112%; line-height:.9; letter-spacing:-.03em; font-variant-numeric:tabular-nums; font-size:clamp(46px,min(15cqw,21cqh),120px)}
.total span{display:inline-block; padding:.04em .22em .08em; border-radius:.22em; background:var(--green)}
.msg{margin:0; font-weight:600; font-size:clamp(14px,min(2.2cqw,3.4cqh),18px)}
.stats{display:flex; flex-wrap:wrap; justify-content:center; gap:6px clamp(14px,3cqw,30px); margin:0; font-size:clamp(12.5px,min(1.8cqw,3cqh),15px); color:var(--muted)}
.stats div{display:flex; gap:6px; align-items:baseline}
.stats dt{margin:0}
.stats dd{margin:0; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
.actions{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; padding-bottom:6px}
.fine{margin:0; font-size:clamp(11px,min(1.5cqw,2.6cqh),12.5px); color:var(--muted); max-width:46ch; line-height:1.4}
.fine a{color:var(--ink); font-weight:700; text-underline-offset:3px}
.badge{position:relative; display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:999px; background:var(--ink); color:var(--green); font-weight:900; letter-spacing:.06em; font-size:clamp(12px,min(1.8cqw,3cqh),15px); animation:badgeIn .6s cubic-bezier(.2,1.4,.3,1) .25s both; flex:none}
.confetti{position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none}
.confetti i{position:absolute; width:8px; height:8px; border-radius:2px; background:var(--c); opacity:0; animation:confetti 1.1s cubic-bezier(.15,.7,.3,1) calc(.35s + var(--d)) both}
.toast{position:absolute; left:50%; bottom:14px; z-index:5; transform:translateX(-50%); max-width:min(92%,520px); padding:10px 16px; border-radius:14px; background:var(--ink); color:var(--white); font-size:13px; font-weight:600; line-height:1.4; animation:rise .25s ease both; user-select:text; -webkit-user-select:text}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

.foot{width:100%; max-width:900px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px; font-size:12.5px; color:var(--page-muted)}
.foot a{color:var(--page-ink); font-weight:700; text-decoration:none}
.foot a:hover{text-decoration:underline; text-underline-offset:3px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0; transform:translateY(10px) scale(.985)}to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes heartLost{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-10deg)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
@keyframes breathe{0%,100%{transform:scale(.92); opacity:.8}50%{transform:scale(1.06); opacity:1}}
@keyframes badgeIn{from{opacity:0; transform:scale(.6) rotate(-4deg)}to{opacity:1; transform:none}}
@keyframes confetti{0%{opacity:1; transform:translate(0,0) rotate(0)}100%{opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}

@media (prefers-reduced-motion: reduce){
  .hero svg,.hero .glow,.timer.low,.confetti i{animation:none}
  .overlay,.hud,.badge,.toast{animation-duration:.01s; animation-delay:0s}
  .btn,.btn .arr,.sound,.iconbtn{transition:none}
}
</style>
</head>

/* ---------- pure helpers (unit-testable) ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function curve(t, xs, ys) {
  if (t <= xs[0]) return ys[0];
  for (let i = 1; i < xs.length; i++) {

const fmtMoney = (n) => '$' + Math.round(n).toLocaleString('en-US');
const fmtTime = (s) => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

function runSelfTests() {
  const t = [
    ['savings add exactly 100', applySavings(2300) === 2400],
    ['waste subtracts 200', applyWaste(500) === 300],
    ['score never negative', applyWaste(100) === 0 && applyWaste(0) === 0],
    ['overlap true when touching', circlesOverlap(0, 0, 10, 15, 0, 5)],
    ['overlap false when apart', !circlesOverlap(0, 0, 10, 16, 0, 5)],
    ['money format', fmtMoney(4200) === '$4,200'],
    ['time format', fmtTime(18) === '00:18' && fmtTime(17.2) === '00:18'],
    ['phase 2 is ~20% faster', Math.abs(curve(15, CONFIG.CURVE_T, CONFIG.FALL_MULT) - 1.2) < 1e-9],
    ['messages by threshold', messageFor(0) === CONFIG.MESSAGES[0].text && messageFor(4100) === CONFIG.MESSAGES[3].text],
  ];
  const failed = t.filter(x => !x[1]).map(x => x[0]);
  if (failed.length) console.error('PUMP DROP self-tests failed:', failed);
  return { passed: t.length - failed.length, failed };
}

function layout(g, w, h) {
  const ratio = g.w ? g.player.x / g.w : 0.5, sx = g.w ? w / g.w : 1, sy = g.h ? h / g.h : 1;
  g.w = w; g.h = h;

  g.ps = clamp(w * 0.095, 58, 86);
  g.py = h - g.ps * 0.5 - clamp(h * 0.065, 20, 36);
  g.hitR = g.ps * CONFIG.HITBOX;
  g.player.x = clamp(ratio * w, g.ps / 2, w - g.ps / 2);
  for (const o of g.objects) { o.x = clamp(o.x * sx, g.r, w - g.r); o.y *= sy; }
}

function spawn(g) {
  const t = g.elapsed, r = g.r, margin = r + 10;
  let waste = Math.random() < curve(t, CONFIG.CURVE_T, CONFIG.WASTE_CHANCE);
  if (t < 1.2 || t - g.lastWasteAt < CONFIG.MIN_WASTE_GAP || g.wasteStreak >= CONFIG.MAX_WASTE_STREAK) waste = false;
  const near = g.objects.filter(o => o.y < r * 3.4);
  const free = (x) => x >= margin && x <= g.w - margin && near.every(o => Math.abs(o.x - x) > r * 2.7);
  let x = null;
  // Later in the round, sometimes drop waste right beside fresh savings: a real risk/reward choice.
  if (waste && t > 10 && Math.random() < 0.45) {
    const bait = near.find(o => o.type === 'save');
    if (bait) { const cand = bait.x + (Math.random() < 0.5 ? -1 : 1) * r * (3 + Math.random() * 1.4); if (free(cand)) x = cand; }
  }
  for (let i = 0; x === null && i < 12; i++) { const cand = margin + Math.random() * (g.w - margin * 2); if (free(cand)) x = cand; }
  if (x === null) return;                       // no clean slot this tick: skip rather than overlap
  g.objects.push({ id: g.nextId++, type: waste ? 'waste' : 'save', x, y: -r - 4, age: 0, ghost: false, dead: false });

    const a = Math.random() * TAU, s = 90 + Math.random() * 190;
    g.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, life: 0.45 + Math.random() * 0.25, max: 0.7, size: 2.5 + Math.random() * 3.5, color });

function endGame(g, reason) {

  g.mode = 'over'; g.overAt = performance.now();
  g.objects.length = 0;                        // nothing keeps falling after game over
  g.input.left = g.input.right = g.input.dragging = false;
  g.cb.onEnd({
    reason, score: g.score, caught: g.caught, hits: g.hits,
    time: reason === 'time' ? CONFIG.GAME_DURATION : Math.min(CONFIG.GAME_DURATION, Math.floor(g.elapsed)),

function updateFx(g, dt) {
  for (const p of g.particles) { p.life -= dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  g.particles = g.particles.filter(p => p.life > 0);
  for (const l of g.labels) { l.life -= dt; l.y -= 52 * dt; }
  g.labels = g.labels.filter(l => l.life > 0);
  g.shake = Math.max(0, g.shake - dt); g.pulse = Math.max(0, g.pulse - dt * 2.6);
}

function update(g, dt) {
  const p = g.player, half = g.ps / 2, t = (g.elapsed = Math.min(CONFIG.GAME_DURATION, g.elapsed + dt));

  // --- player movement (delta-time, slightly eased) ---
  const speed = CONFIG.PLAYER_SPEED * clamp(g.w / 900, 0.62, 1.1);
  if (g.input.dragging) {
    const tx = clamp(g.input.targetX, half, g.w - half), nx = p.x + (tx - p.x) * Math.min(1, dt * 26);
    p.vx = dt > 0 ? (nx - p.x) / dt : 0; p.x = nx;
  } else {
    const dir = (g.input.right ? 1 : 0) - (g.input.left ? 1 : 0);
    p.vx += (dir * speed - p.vx) * Math.min(1, dt * 18);
    p.x += p.vx * dt;
  }
  if (p.x < half) { p.x = half; p.vx = Math.max(0, p.vx); }
  if (p.x > g.w - half) { p.x = g.w - half; p.vx = Math.min(0, p.vx); }

  // --- falling + collisions ---
  const fall = CONFIG.BASE_FALL * g.h * curve(t, CONFIG.CURVE_T, CONFIG.FALL_MULT);
  for (const o of g.objects) {
    o.y += fall * dt; o.age += dt;

      if (o.type === 'save') {

        o.dead = true; g.score = applyWaste(g.score); g.hits++; g.lives--;
        p.hurt = 0.32; p.invuln = CONFIG.DAMAGE_COOLDOWN / 1000; g.shake = g.reduced ? 0 : 0.3;
        burst(g, o.x, o.y, '#FF5A65', 8); addLabel(g, '−' + fmtMoney(CONFIG.WASTE_PENALTY), 'waste'); sfx.hit(); g.cb.onHit();

}

function updateIdle(g, dt) {
  if (g.reduced) { g.objects.length = 0; return; }
  g.spawnTimer -= dt;
  if (g.spawnTimer <= 0 && g.objects.length < 9) {
    g.spawnTimer = 0.9 + Math.random() * 0.7;
    g.objects.push({ id: g.nextId++, type: 'save', x: g.r * 2 + Math.random() * (g.w - g.r * 4), y: -g.r * 2, age: Math.random() * 6, idle: true, sp: 0.07 + Math.random() * 0.05, sc: 0.6 + Math.random() * 0.5 });

    x.font = '900 ' + Math.round(r * 1.18) + 'px Inter, system-ui, -apple-system, "Segoe UI", sans-serif';

}

const CONFETTI = Array.from({ length: 16 }, (_, i) => {
  const a = (i / 16) * TAU + (i % 2) * 0.2, d = 70 + (i * 37 % 60);
  return { '--x': Math.round(Math.cos(a) * d) + 'px', '--y': Math.round(Math.sin(a) * d * 0.7 - 10) + 'px', '--r': (i % 2 ? 220 : -180) + 'deg', '--d': (i % 4) * 0.03 + 's', '--c': ['#24FF55', '#080808', '#B9B4FF'][i % 3] };
});

function shareUrl() {
  try { if (window.top === window && /^https?:$/.test(location.protocol)) return location.href; } catch (e) {}
  return '';
}
async function shareScore(score) {
  const text = 'I just saved ' + fmtMoney(score) + ' playing PUMP DROP 💚 Think you can beat me?';
  const url = shareUrl(), full = url ? text + ' ' + url : text;
  if (navigator.share) {
    try { await navigator.share(url ? { text, url } : { text }); return { ok: 'Shared.' }; }
    catch (e) { if (e && e.name === 'AbortError') return { ok: '' }; }
  }
  try { await navigator.clipboard.writeText(full); return { ok: 'Score copied to your clipboard.' }; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = full; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); const done = document.execCommand('copy'); ta.remove();
    if (done) return { ok: 'Score copied to your clipboard.' };
  } catch (e) {}
  return { ok: 'Copy this: ' + full };
}

function Results({ result, onPlay }) {
  const [toast, setToast] = useState('');
  const timer = useRef(0);
  useEffect(() => () => clearTimeout(timer.current), []);
  const onShare = async () => {
    const r = await shareScore(result.score);
    if (!r.ok) return;
    setToast(r.ok); clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(''), r.ok.startsWith('Copy this') ? 9000 : 2400);
  };
  return h('div', { className: 'overlay veil', role: 'dialog', 'aria-label': 'Results' },
    result.isBest && h('div', { className: 'badge' }, 'NEW HIGH SCORE! 🏆', h('span', { className: 'confetti', 'aria-hidden': 'true' }, CONFETTI.map((s, i) => h('i', { key: i, style: s })))),
    h('h2', { className: 'res-title' }, result.reason === 'lives' ? 'CLOUD WASTE GOT YOU!' : 'TIME’S UP!'),
    h('p', { className: 'kicker' }, 'YOU SAVED'),
    h(CountUp, { value: result.score }),
    h('p', { className: 'msg' }, messageFor(result.score)),
    h('dl', { className: 'stats' },
      h('div', null, h('dt', null, 'Savings collected:'), h('dd', null, result.caught)),
      h('div', null, h('dt', null, 'Waste hits:'), h('dd', null, result.hits)),
      h('div', null, h('dt', null, 'Time survived:'), h('dd', null, result.time + 's'))),
    h('div', { className: 'actions' },
      h('button', { className: 'btn primary', type: 'button', onClick: onPlay }, 'PLAY AGAIN ', h('span', { className: 'arr spin', 'aria-hidden': 'true' }, '↻')),
      h('button', { className: 'btn ghost', type: 'button', onClick: onShare }, 'SHARE SCORE')),
    h('p', { className: 'fine' }, 'This is an arcade score, not an estimate of real-world savings. For the real thing, visit ',
      h('a', { href: 'https://pump.co', target: '_blank', rel: 'noopener noreferrer' }, 'pump.co'), '.'),
    toast && h('div', { className: 'toast', role: 'status' }, toast));
}

function App() {
  const [screen, setScreen] = useState('start');       // start | playing | paused | results
  const [hud, setHud] = useState({ score: 0, lives: CONFIG.STARTING_LIVES, time: CONFIG.GAME_DURATION });
  const [result, setResult] = useState(null);
  const [best, setBest] = useState(loadBest);
  const [soundOn, setSoundOn] = useState(false);
  const stageRef = useRef(null), canvasRef = useRef(null), gameRef = useRef(null), bestRef = useRef(best), hitTimer = useRef(0);
  if (!gameRef.current) gameRef.current = createGame();
  bestRef.current = best;

  const start = useCallback(() => {
    const g = gameRef.current;
    if (!g.w) return;
    if (g.mode === 'playing' && performance.now() - g.startedAt < 350) return;   // ignore rapid double-starts
    resetGame(g);
    setHud({ score: 0, lives: CONFIG.STARTING_LIVES, time: CONFIG.GAME_DURATION });
    setResult(null); setScreen('playing');
  }, []);
  const pause = useCallback((auto) => {
    const g = gameRef.current; if (g.mode !== 'playing') return;
    g.mode = 'paused'; g.autoPaused = !!auto; g.input.left = g.input.right = g.input.dragging = false; setScreen('paused');
  }, []);
  const resume = useCallback(() => {
    const g = gameRef.current; if (g.mode !== 'paused') return;
    g.mode = 'playing'; g.autoPaused = false; setScreen('playing');
  }, []);

  // Engine: one loop, one set of listeners, for the life of the page.
  useEffect(() => {
    const g = gameRef.current, canvas = canvasRef.current, stage = stageRef.current, ctx = canvas.getContext('2d');
    LOGO_PATH = new Path2D(LOGO_D); window.PumpDrop.game = g;   // debug handle
    let raf = 0, last = performance.now(), dpr = 1, sprites = null, alive = true;
    const mq = matchMedia('(prefers-reduced-motion: reduce)'); g.reduced = mq.matches;
    const onMq = () => { g.reduced = mq.matches; };
    mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);

    g.cb.onHud = setHud;
    g.cb.onHit = () => {
      stage.classList.add('hit'); clearTimeout(hitTimer.current);
      hitTimer.current = setTimeout(() => stage.classList.remove('hit'), 150);
    };
    g.cb.onEnd = (res) => {
      const prev = bestRef.current, isBest = res.score > prev;
      if (isBest) { saveBest(res.score); setBest(res.score); }
      if (isBest) sfx.best(); else sfx.over();
      setHud({ score: res.score, lives: g.lives, time: res.reason === 'time' ? 0 : Math.max(0, Math.ceil(CONFIG.GAME_DURATION - g.elapsed)) });
      setResult(Object.assign({ isBest }, res)); setScreen('results');
    };

    const resize = () => {
      const w = stage.clientWidth, hgt = stage.clientHeight; if (!w || !hgt) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const rChanged = !sprites || w !== g.w;
      layout(g, w, hgt);
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(hgt * dpr);
      if (rChanged) sprites = { save: makeSprite('save', g.r, dpr), waste: makeSprite('waste', g.r, dpr) };
    };
    const ro = new ResizeObserver(resize); ro.observe(stage); resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (alive && g.w) sprites = { save: makeSprite('save', g.r, dpr), waste: makeSprite('waste', g.r, dpr) }; });

    const frame = (now) => {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      if (g.mode === 'playing') update(g, dt);
      else if (g.mode === 'idle') updateIdle(g, dt);
      else if (g.mode === 'over') updateFx(g, dt);
      draw(g, ctx, dpr, sprites);
    };
    raf = requestAnimationFrame(frame);

    // keyboard
    const isControl = (el) => el && el.closest && el.closest('button, a, input, textarea, select');
    const onKeyDown = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key, playing = g.mode === 'playing';
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (playing) { g.input.left = true; e.preventDefault(); } }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (playing) { g.input.right = true; e.preventDefault(); } }
      else if (k === 'ArrowUp' || k === 'ArrowDown') { if (playing) e.preventDefault(); }
      else if (k === ' ' || k === 'Enter') {
        if (isControl(e.target)) return;                       // let focused buttons handle their own activation
        if (e.repeat) { e.preventDefault(); return; }
        if (g.mode === 'idle' || (g.mode === 'over' && performance.now() - g.overAt > 700)) { e.preventDefault(); start(); }
        else if (g.mode === 'paused') { e.preventDefault(); resume(); }
        else if (playing) e.preventDefault();
      }
      else if (k === 'p' || k === 'P' || k === 'Escape') { if (playing) pause(false); else if (g.mode === 'paused') resume(); }
    };
    const onKeyUp = (e) => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') g.input.left = false;
      if (k === 'ArrowRight' || k === 'd' || k === 'D') g.input.right = false;
    };
    const onBlur = () => { g.input.left = g.input.right = false; };

    // pointer / touch drag
    const px = (e) => e.clientX - canvas.getBoundingClientRect().left;
    const onDown = (e) => {
      if (g.mode !== 'playing' || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const x = px(e), off = x - g.player.x;
      g.input.dragging = true; g.input.pid = e.pointerId;
      g.input.offset = Math.abs(off) < g.ps ? off : 0;         // grab the logo where you touched it; otherwise it comes to your finger
      g.input.targetX = x - g.input.offset;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    };
    const onMove = (e) => { if (g.input.dragging && e.pointerId === g.input.pid) { g.input.targetX = px(e) - g.input.offset; e.preventDefault(); } };
    const onUp = (e) => { if (e.pointerId === g.input.pid) { g.input.dragging = false; g.input.pid = null; } };
    const stopTouch = (e) => { if (g.mode === 'playing') e.preventDefault(); };

    // pause when the tab is hidden; resume cleanly when it returns
    const onVis = () => {
      if (document.hidden) pause(true);
      else { last = performance.now(); if (g.mode === 'paused' && g.autoPaused) resume(); }
    };

    window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp); window.addEventListener('blur', onBlur);
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp); canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchmove', stopTouch, { passive: false });
    document.addEventListener('visibilitychange', onVis);
    return () => {
      alive = false; cancelAnimationFrame(raf); ro.disconnect(); clearTimeout(hitTimer.current);
      mq.removeEventListener ? mq.removeEventListener('change', onMq) : mq.removeListener(onMq);
      window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); window.removeEventListener('blur', onBlur);
      canvas.removeEventListener('pointerdown', onDown); canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerup', onUp); canvas.removeEventListener('pointercancel', onUp);
      canvas.removeEventListener('touchmove', stopTouch);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [start, pause, resume]);

  const toggleSound = () => { const on = !soundOn; enableAudio(on); setSoundOn(on); if (on) tone(880, 0.08, 'triangle', 0.06, 1320); };

  return h('div', { className: 'page' },
    h('header', { className: 'top' },
      h('a', { className: 'wordmark', href: 'https://pump.co', target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Pump' }, h(Logo), 'PUMP'),
      h('button', { className: 'sound', type: 'button', onClick: toggleSound, 'aria-pressed': soundOn ? 'true' : 'false' },
        h('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' },
          h('path', { d: 'M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z' }),
          soundOn ? h('path', { d: 'M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12' }) : h('path', { d: 'M16 9.5l5 5M21 9.5l-5 5' })),
        soundOn ? 'Sound on' : 'Sound off', h('span', { className: 'dot', 'aria-hidden': 'true' }))),
    h('main', { className: 'stage', ref: stageRef, 'aria-label': 'PUMP DROP game' },
      h('canvas', { ref: canvasRef, 'aria-hidden': 'true' }),
      (screen === 'playing' || screen === 'paused' || screen === 'results') && h(Hud, { hud, onPause: () => pause(false) }),
      screen === 'start' && h(StartScreen, { best, onPlay: start }),
      screen === 'paused' && h('div', { className: 'overlay veil', role: 'dialog', 'aria-label': 'Paused' },
        h('h2', { className: 'res-title' }, 'PAUSED'),
        h('p', { className: 'tag' }, 'The clock is stopped.'),
        h('button', { className: 'btn primary', type: 'button', onClick: resume, autoFocus: true }, 'RESUME')),
      screen === 'results' && result && h(Results, { result, onPlay: start })),
    h('footer', { className: 'foot' },
      h('span', null, 'Made for cloud savings enthusiasts.'),
      h('span', null, 'Powered by ', h('a', { href: 'https://pump.co', target: '_blank', rel: 'noopener noreferrer' }, 'Pump.co'))));
}

const selfTest = runSelfTests();
window.PumpDrop = { CONFIG, runSelfTests, selfTest, helpers: { curve, circlesOverlap, applySavings, applyWaste, messageFor, fmtMoney, fmtTime } };
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
})();
</script>
